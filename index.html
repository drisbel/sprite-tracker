<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sprite Locker</title>
  <script>
    (function () {
      var mobile = window.matchMedia('(max-width: 700px)').matches;
      location.replace(mobile ? 'mobile.html' : 'desktop.html');
    })();
  </script>
</head>
<body></body>
</html>
