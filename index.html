<!doctype html>
<html>
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Sprite Locker</title>

  <!-- App / Home Screen name -->
  <meta name="application-name" content="Sprite Locker">
  <meta name="apple-mobile-web-app-title" content="Sprite Locker">

  <!-- Installed app behaviour -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <!-- PWA manifest -->
  <link rel="manifest" href="manifest.json">

  <script>
    (function () {
      var mobile = window.matchMedia('(max-width: 700px)').matches;
      location.replace(mobile ? 'mobile.html' : 'desktop.html');
    })();
  </script>
</head>

<body></body>
</html>
